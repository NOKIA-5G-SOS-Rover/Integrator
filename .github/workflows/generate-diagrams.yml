name: Generate PlantUML Diagrams

on:
  push:
    branches: [main, master]
    paths: ['**.puml']

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: gets the full history so we can pull/push

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y graphviz plantuml default-jre

      - name: Generate SVGs
        run: |
          mkdir -p img
          find docs -name "*.puml" -exec plantuml -tsvg {} -o "${GITHUB_WORKSPACE}/img" \;

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-generate SVG diagrams [skip ci]"
          file_pattern: "img/*.svg"
          # This pulls the latest remote changes before pushing
          skip_fetch: false 
          push_options: '--force'