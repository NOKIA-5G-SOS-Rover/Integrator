name: Generate PlantUML Diagrams

on:
  push:
    branches: [main, master]
    paths: ['**.puml']

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necessary to pull and rebase

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y graphviz plantuml default-jre

      - name: Generate SVGs
        run: |
          mkdir -p img
          find docs -name "*.puml" -exec plantuml -tsvg {} -o "${GITHUB_WORKSPACE}/img" \;

      - name: Commit and Push Changes
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add changes
          git add img/*.svg
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            # Commit changes
            git commit -m "chore: auto-generate SVG diagrams [skip ci]"
            
            # Pull latest changes (rebase) to handle the "diverged" error
            # This incorporates any new commits from main into our local state
            git pull --rebase origin main || git pull --rebase origin master
            
            # Push back to repo
            git push
          fi