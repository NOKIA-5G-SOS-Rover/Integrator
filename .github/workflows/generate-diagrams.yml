name: Generate PlantUML Diagrams

on:
  push:
    branches: [main, master]
    paths: ['**.puml']

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Tools
        run: sudo apt-get update && sudo apt-get install -y graphviz plantuml default-jre

      - name: Generate SVGs
        run: |
          mkdir -p docs/architecture/img
          find docs/architecture/diagrams -name "*.puml" -exec plantuml -tsvg {} -o "${GITHUB_WORKSPACE}/docs/architecture/img" \;

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/architecture/img/*.svg
          if git diff --staged --quiet; then
            echo "No changes detected, nothing to commit."
          else
            git commit -m "chore: auto-generate SVG diagrams [skip ci]"
            
            # This is the magic line that fixes your error
            git pull --rebase origin main || git pull --rebase origin master
            
            git push
          fi
