name: Generate PlantUML Diagramsv2

on:
  push:
    branches: [main, master]
    paths: ['**.puml']

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Graphviz and PlantUML
        run: sudo apt-get update && sudo apt-get install -y graphviz plantuml

      - name: Generate SVGs
        run: |
          mkdir -p img
          find docs -name "*.puml" -exec plantuml -tsvg {} -o "${GITHUB_WORKSPACE}/img" \;

      # Replacing the 3rd-party action with native git commands
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add img/*.svg
          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-generate SVG diagrams [skip ci]"
            git push
          fi